[project]
name = "nevis-search"
version = "1.0.0"
description = "Client and document search API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "model2vec>=0.6,<1",
    "numpy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "pydantic[email]>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.vercel.scripts]
build = "python scripts/download_model.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["semantic: retrieval checks using the real, downloaded embedding model", "postgres: integration checks requiring TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["nevis_search"]
