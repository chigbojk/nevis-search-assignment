name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nevis
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: nevis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nevis -d nevis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://nevis:test-password@localhost:5432/nevis_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python scripts/download_model.py
      - run: uv run pytest --cov=nevis_search --cov-report=term-missing
